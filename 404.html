<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Página Não Encontrada</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc; color: #1e293b; text-align: center; }
    .card { background: white; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); max-width: 450px; }
    h1 { font-size: 4rem; margin: 0; color: #3b82f6; }
    p { color: #64748b; margin: 1rem 0 1.5rem; }
    a { display: inline-block; background: #3b82f6; color: white; text-decoration: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 500; }
    a:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <h2>Página não encontrada</h2>
    <p>O conteúdo que você procurava não existe ou foi movido para outro local.</p>
    <a href="/">Voltar para a Página Inicial</a>
  </div>
</body>
</html>
